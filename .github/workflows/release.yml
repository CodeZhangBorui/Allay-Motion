# 发版（docs/decisions.md M8）：推 v* 标签或手动触发时，在 Windows 上构建 NSIS 安装包，上传为工作流产物，
# 安装包和 SHA-256 校验和上传成功后，自动正式发布。
#
# - 只有推送 v* 标签会正式发布；手动触发只构建和上传工作流产物。
# - 先建草稿并挂上全部附件，随后立即自动发布；构建失败或缺文件的版本不会公开。
# - 安装包没有代码签名（H-SIGN），工作流里没有任何证书或密钥；不配置自动更新（electron-builder 的 publish 为 null）。
# - 悦灵的图集和图标用仓库里提交的烘焙产物（packages/mascot/generated），不从 Mojang 下载、不现场烘焙。
# - 权限最小化：构建作业只读仓库；只有发布作业有 contents: write，用的是 GitHub 自带的 GITHUB_TOKEN。
# - 第三方 action 固定到提交哈希（注释里是版本标签）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建安装包
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      installer: ${{ steps.meta.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 固定版本的 FFmpeg（校验 SHA-256），随安装包分发（LGPL，许可全文一起带上）
      - name: pnpm ffmpeg:fetch
        run: pnpm ffmpeg:fetch

      # pnpm dist：打包，然后跑打包后的检查（tests/dist：fuses、安装包内容、冷启动）。
      # T-ARC-7 在这台共享机器上只记数字、不按预算判定：它不是参考机器（docs/decisions.md M8）
      - name: pnpm dist
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ALLAY_T_ARC_7_REPORT_ONLY: '1'

      - name: 校验和与版本
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem apps/desktop/release -Filter '*-x64-setup.exe' | Select-Object -First 1
          if (-not $exe) { throw '没有找到安装包' }
          # 发布资产的文件名里不能有空格：GitHub 上传时会把空格换成点，SHA256SUMS.txt 里的名字就对不上了
          $exe = Rename-Item $exe.FullName ($exe.Name -replace ' ', '-') -PassThru
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "apps/desktop/release/SHA256SUMS.txt"
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "安装包：$($exe.Name)，$([math]::Round($exe.Length / 1MB, 1)) MiB，SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            apps/desktop/release/*-x64-setup.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: 正式发布 Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<'EOF'
          > **NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.**
          > 本软件不是 Minecraft 官方产品，未经 Mojang 或 Microsoft 批准，也与它们无关。

          发布清单（`docs/release-checklist.md`）记录了品牌、名称、代码签名等事项的状态。

          - 安装包**没有代码签名**：Windows SmartScreen 会提示“未知发布者”。
          - 校验和见 `SHA256SUMS.txt`。
          - 更新记录见 `CHANGELOG.md`。
          EOF
          pre=()
          if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/*-x64-setup.exe dist/SHA256SUMS.txt --draft --verify-tag --target "$SHA" --title "$TAG" --notes-file notes.md "${pre[@]}"
          gh release edit "$TAG" --draft=false
