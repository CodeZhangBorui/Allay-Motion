# 每次推送或 PR 跑一遍完整检查；可选模块拆除检查按需手动运行。
# 安装包由 release.yml 构建。这里只读仓库，第三方 action 固定到提交哈希。
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      check_removable:
        description: 额外检查移除可选模块后的完整构建和测试
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: windows-latest
    # CI 的 WebGL 是软件渲染（WARP），引擎测试比显卡上慢二三十倍（tests/engine/software.ts）
    timeout-minutes: ${{ inputs.check_removable && 360 || 180 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Electron 45 没有 postinstall，二进制在第一次用时才下载；先取好，免得并行的测试同时去启动一个还在下载的 Electron
      - name: 取 Electron 二进制
        run: pnpm exec tsx scripts/ensure-electron-dist.ts

      # 固定版本的 FFmpeg，校验 SHA-256（scripts/ffmpeg-build.ts）；test:export、e2e 都要用
      # T-UI-5 的截图基线是 1440×902 的窗口；runner 默认的显示分辨率放不下，窗口被压到 1120×720（docs/decisions.md M8）
      - name: 显示分辨率 1920×1080
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: pnpm ffmpeg:fetch
        run: pnpm ffmpeg:fetch

      # 端到端测试自己设 ALLAY_E2E_HIDDEN：窗口不显示；测试不碰真实的游戏文件（假游戏目录、假下载服务器）
      - name: pnpm check
        run: pnpm check

      # 只有手动勾选时才重复跑完整测试，验证移除可选模块后的行为。
      - name: pnpm check:removable
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_removable }}
        run: pnpm check:removable

      - name: 上传失败时的测试记录
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-check
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
