# CI（docs/01-product-architecture.md 1.10，docs/decisions.md M8）：PR 和 main 上跑 pnpm check 和 pnpm check:removable。
# 安装包由 release.yml 构建。这里只读仓库，没有任何密钥。
# 第三方 action 固定到提交哈希（注释里是对应的版本标签），升级时一起改。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 固定版本的 FFmpeg，校验 SHA-256（scripts/ffmpeg-build.ts）；test:export、e2e 都要用
      - name: pnpm ffmpeg:fetch
        run: pnpm ffmpeg:fetch

      # 端到端测试自己设 ALLAY_E2E_HIDDEN：窗口不显示；测试不碰真实的游戏文件（假游戏目录、假下载服务器）
      - name: pnpm check
        run: pnpm check

      - name: 上传失败时的测试记录
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-check
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  removable:
    # 可选模块可以整块拆除（docs/code-editing-and-mcp-plan.md 3.1 第 5 条，T-DEV-4）：
    # 把 packages/optional 移走后再跑一遍完整的 pnpm check，跑完放回
    name: pnpm check:removable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: pnpm ffmpeg:fetch
        run: pnpm ffmpeg:fetch

      - name: pnpm check:removable
        run: pnpm check:removable
